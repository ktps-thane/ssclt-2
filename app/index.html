<title>SSC Truck Management</title>
<meta name="description" content="ระบบจัดรถและบริหารรถบรรทุก SSC — แบบร่าง V2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: ops console. Left rail on desktop, bottom tab bar on phone; dense list rows keyed by license-plate chips; one list card per section. */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --surface-2:#ebf1ea; --line:#d7e0d6; --line-strong:#b6c4b6;
  --fg:#15211a; --fg-2:#45554b; --fg-3:#6a7a6f;
  --brand:#2f7f3a; --brand-strong:#1e5c28; --brand-soft:#e1efe0; --brand-logo:#51a557; --on-brand:#ffffff;
  --fh-ink:#1c5cab; --fh-soft:#e2edfb; --bh-ink:#9a3f14; --bh-soft:#fbe8de; --so-ink:#4a3aa7; --so-soft:#ebe8fb; --ot-ink:#45554b; --ot-soft:#e8ece7;
  --good:#0ca30c; --good-ink:#0b6a1b; --good-soft:#e0f3df;
  --warn:#fab219; --warn-ink:#704b00; --warn-soft:#fdf1d3;
  --serious:#ec835a; --serious-ink:#8d3815; --serious-soft:#fce7de;
  --crit:#d03b3b; --crit-ink:#a02424; --crit-soft:#fbe3e3;
  --plate-bg:#fbfbf5; --plate-fg:#101410; --plate-line:#2a312b;
  --demo:#fab219; --demo-soft:#fff2cc; --demo-ink:#5a3c00;
  --scrim:rgba(12,24,16,.48);
  --shadow:0 1px 2px rgba(20,40,25,.07), 0 6px 18px rgba(20,40,25,.07);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1411; --surface:#151d18; --surface-2:#1c2620; --line:#29362e; --line-strong:#3a4a40;
    --fg:#e5ede7; --fg-2:#aab9af; --fg-3:#7f8f85;
    --brand:#3f9a4a; --brand-strong:#8fd59c; --brand-soft:#183020; --brand-logo:#51a557; --on-brand:#ffffff;
    --fh-ink:#8dbcf1; --fh-soft:#15263b; --bh-ink:#f0a27e; --bh-soft:#3a2117; --so-ink:#b4abf3; --so-soft:#25213f; --ot-ink:#aab9af; --ot-soft:#222c26;
    --good-ink:#7fd88a; --good-soft:#15301a; --warn-ink:#f6cf74; --warn-soft:#352a10; --serious-ink:#f3aa8b; --serious-soft:#3a2219; --crit-ink:#f19a9a; --crit-soft:#3b1d1d;
    --demo-soft:#33290f; --demo-ink:#f6d27c;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#151d18; --surface-2:#1c2620; --line:#29362e; --line-strong:#3a4a40;
  --fg:#e5ede7; --fg-2:#aab9af; --fg-3:#7f8f85;
  --brand:#3f9a4a; --brand-strong:#8fd59c; --brand-soft:#183020; --brand-logo:#51a557; --on-brand:#ffffff;
  --fh-ink:#8dbcf1; --fh-soft:#15263b; --bh-ink:#f0a27e; --bh-soft:#3a2117; --so-ink:#b4abf3; --so-soft:#25213f; --ot-ink:#aab9af; --ot-soft:#222c26;
  --good-ink:#7fd88a; --good-soft:#15301a; --warn-ink:#f6cf74; --warn-soft:#352a10; --serious-ink:#f3aa8b; --serious-soft:#3a2219; --crit-ink:#f19a9a; --crit-soft:#3b1d1d;
  --demo-soft:#33290f; --demo-ink:#f6d27c;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--brand-strong);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.rail{display:none}
.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.top .logo{width:34px;height:34px;border-radius:8px;background:#fff;object-fit:contain;padding:2px;border:1px solid var(--line)}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.top .ttl small{font-size:11.5px;color:var(--fg-3);letter-spacing:.04em}
.top .ttl b{font:600 17px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{width:100%;max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px;font-size:11px;line-height:1.2;color:var(--fg-3);text-decoration:none;border-radius:10px;white-space:nowrap}
.tabbar a[aria-current="page"]{color:var(--brand-strong);font-weight:600}
.tabbar a[aria-current="page"] svg{stroke-width:2.2}
@media (min-width:960px){
  .app{grid-template-columns:236px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
  .rail .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .rail .brand img{width:46px;height:46px;border-radius:10px;background:#fff;object-fit:contain;padding:3px;border:1px solid var(--line)}
  .rail .brand b{font:700 15px/1.2 var(--f-display);display:block}
  .rail .brand small{font-size:12px;color:var(--fg-3)}
  .rail a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--fg-2);text-decoration:none;font-weight:500}
  .rail a:hover{background:var(--surface-2)}
  .rail a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}
  .rail .sep{height:1px;background:var(--line);margin:10px 6px}
  .rail .grp{font-size:11.5px;letter-spacing:.06em;color:var(--fg-3);padding:4px 10px}
  .tabbar{display:none}
  .top .logo{display:none}
  .top{padding:12px 32px}
  main{padding-inline:32px;padding-block:24px 56px}
}
body.driver .tabbar, body.driver .rail{display:none}
body.driver .app{grid-template-columns:minmax(0,1fr)}
body.driver main{padding-bottom:40px;max-width:640px}
@media (min-width:960px){ body.driver .top .logo{display:block} }

.modechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap;border:0;cursor:pointer;text-decoration:none}
.modechip .dot{width:8px;height:8px;border-radius:50%;background:var(--fg-3)}
.modechip.live .dot{background:var(--good)}
.modechip.demo{background:var(--demo-soft);color:var(--demo-ink)}
.modechip.demo .dot{background:var(--demo)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:9px 16px;font-size:13.5px;background:var(--demo-soft);color:var(--demo-ink);border-bottom:1px solid var(--line)}
.banner b{font-weight:600}
.banner .btn{min-height:32px;padding:3px 10px;font-size:13px}
.banner.ro{background:var(--crit-soft);color:var(--crit-ink)}
@media (min-width:960px){ .banner{padding-inline:32px} }

/* building blocks */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h .sub{font-size:13px;color:var(--fg-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:10px}
.rowflex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0}
.row.sel{background:var(--brand-soft)}
.row.dim{opacity:.62}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.l1{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.meta{font-size:13.5px;color:var(--fg-2)}
.meta>svg.i{width:15px;height:15px;vertical-align:-2px}
.muted{color:var(--fg-3)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.empty{padding:22px 16px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--fg);font-weight:600}
.note{font-size:13.5px;color:var(--fg-2);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.note.warn{background:var(--warn-soft);color:var(--warn-ink)}
.note.crit{background:var(--crit-soft);color:var(--crit-ink)}
.note.good{background:var(--good-soft);color:var(--good-ink)}
.note ul{margin:6px 0 0;padding-left:18px}
details.more>summary{cursor:pointer;color:var(--brand-strong);font-weight:500;list-style:none;display:flex;align-items:center;gap:6px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.more[open]>summary::before{transform:rotate(45deg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--crit-ink);border-color:var(--crit-soft);background:var(--crit-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand-strong)}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13.5px;border-radius:8px}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:16px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
:is(.btn,.seg button,a,summary,input,select,textarea,.pick):focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;white-space:nowrap;color:var(--fg-2);min-height:34px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.seg button .c{font-size:12px;color:var(--fg-3);margin-left:4px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lbl{font-size:13px;color:var(--fg-2);font-weight:500}
.field .hint{font-size:12.5px;color:var(--fg-3)}
.req::after{content:" *";color:var(--crit-ink)}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:9px 12px;min-height:44px;font-size:15px}
textarea{min-height:84px;resize:vertical}
input[type="checkbox"],input[type="radio"]{width:20px;height:20px;min-height:0;accent-color:var(--brand);margin:0;flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.errbox{font-size:13.5px;color:var(--crit-ink);background:var(--crit-soft);border-radius:8px;padding:9px 12px}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice label{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:9px;cursor:pointer;min-height:44px;background:var(--surface)}
.choice label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);font-weight:600}

/* subject details */
.plate{display:inline-flex;align-items:center;font:600 14px/1 var(--f-display);letter-spacing:.02em;color:var(--plate-fg);background:var(--plate-bg);border:1.5px solid var(--plate-line);border-radius:5px;padding:5px 7px 4px;box-shadow:inset 0 0 0 2px var(--plate-bg),inset 0 0 0 3px rgba(42,49,43,.28);white-space:nowrap}
.plate.lg{font-size:18px;padding:7px 10px 6px}
.vt{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--f-mono);color:var(--fg-2);padding:4px 6px;border:1px solid var(--line-strong);border-radius:5px;white-space:nowrap}
.vt i{display:inline-flex;gap:2px}
.vt i b{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7}
.own{font-size:12px;color:var(--fg-3);white-space:nowrap}
.kind{display:inline-flex;align-items:center;font:600 11.5px/1 var(--f-mono);padding:4px 6px;border-radius:5px;letter-spacing:.03em;white-space:nowrap}
.k-fh{background:var(--fh-soft);color:var(--fh-ink)} .k-bh{background:var(--bh-soft);color:var(--bh-ink)} .k-so{background:var(--so-soft);color:var(--so-ink)} .k-ot{background:var(--ot-soft);color:var(--ot-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;line-height:1.3;padding:3px 9px 3px 7px;border-radius:12px;background:var(--surface-2);color:var(--fg-2);max-width:100%;min-width:0;text-align:left}
.chip svg.i{width:14px;height:14px;stroke-width:2.2}
.chip.good{background:var(--good-soft);color:var(--good-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chip.serious{background:var(--serious-soft);color:var(--serious-ink)}
.chip.crit{background:var(--crit-soft);color:var(--crit-ink)}
.chip.info{background:var(--fh-soft);color:var(--fh-ink)}
.qno{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;border-radius:10px;background:var(--brand-soft);color:var(--brand-strong)}
.qno small{font-size:11px;letter-spacing:.04em}
.qno b{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.qno.off{background:var(--surface-2);color:var(--fg-3)}
.ticket{position:relative;border:1.5px dashed var(--brand);border-radius:16px;background:var(--surface);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.ticket .big{font:700 64px/1 var(--f-display);color:var(--brand-strong);font-variant-numeric:tabular-nums}
.ticket .site{font:600 16px/1.3 var(--f-display)}

.meter{height:6px;border-radius:3px;background:var(--brand-soft);overflow:hidden;min-width:60px}
.meter>i{display:block;height:100%;background:var(--brand);border-radius:3px}
.meter.warn{background:var(--warn-soft)} .meter.warn>i{background:var(--warn)}
.meter.serious{background:var(--serious-soft)} .meter.serious>i{background:var(--serious)}
.meter.crit{background:var(--crit-soft)} .meter.crit>i{background:var(--crit)}
.util{display:grid;grid-template-columns:auto minmax(60px,1fr) auto;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--fg-2)}
.util .v{font-variant-numeric:tabular-nums;text-align:right}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (min-width:700px){ .stats{grid-template-columns:repeat(3,minmax(0,1fr))} }
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .lbl{font-size:12.5px;color:var(--fg-3)}
.stat .val{font-size:23px;font-weight:600;line-height:1.2}
.stat .val small{font-size:13px;font-weight:500;color:var(--fg-2);margin-left:3px}
.stat .sub{font-size:12.5px;color:var(--fg-2)}

.flow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:760px){ .flow{grid-template-columns:repeat(5,minmax(0,1fr))} }
.flow a{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--fg);min-width:0}
.flow a:hover{border-color:var(--brand)}
.flow .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px/1 var(--f-mono);background:var(--surface-2);color:var(--fg-2)}
.flow .t{flex:1;min-width:0;display:flex;flex-direction:column}
.flow .t small{font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .t span{font-size:13.5px;font-weight:500}
.flow .c{font:600 22px/1 var(--f-body);font-variant-numeric:tabular-nums}
@media (min-width:760px){ .flow a{flex-direction:column;align-items:flex-start;gap:6px} .flow .c{font-size:26px} }

.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.steps span{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border-radius:999px;background:var(--surface-2);color:var(--fg-3);white-space:nowrap}
.steps span b{font:600 11px/1 var(--f-mono);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--fg-3)}
.steps span.done{background:var(--brand-soft);color:var(--brand-strong)}
.steps span.done b{background:var(--brand);color:var(--on-brand)}

.pick{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.pick:first-child{border-top:0}
.pick[aria-pressed="true"],.pick:has(input:checked){background:var(--brand-soft)}
.pick[disabled]{cursor:not-allowed;opacity:.55}
.pick .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.radio{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);margin-top:2px;display:grid;place-items:center}
.pick[aria-pressed="true"] .radio{border-color:var(--brand)}
.pick[aria-pressed="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.reco{font-size:11.5px;font-weight:600;color:var(--on-brand);background:var(--brand);padding:2px 7px;border-radius:5px}

.totals{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:10px 14px;border-radius:var(--r);background:var(--fg);color:var(--bg);font-size:13.5px;box-shadow:var(--shadow)}
.totals b{font-variant-numeric:tabular-nums}
@media (min-width:960px){ .totals{bottom:12px} }

.checks{display:flex;flex-direction:column}
.check{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.check .ic svg{width:14px;height:14px;stroke-width:2.6}
.check.good .ic{background:var(--good-soft);color:var(--good-ink)}
.check.warn .ic{background:var(--warn-soft);color:var(--warn-ink)}
.check.crit .ic{background:var(--crit-soft);color:var(--crit-ink)}
.check.unknown .ic{background:var(--surface-2);color:var(--fg-3)}
.check .t b{font-weight:600;display:block}
.check .t span{font-size:13px;color:var(--fg-2)}
.check .v{font-size:13px;color:var(--fg-2);text-align:right;font-variant-numeric:tabular-nums}

.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (min-width:760px){ .kv{grid-template-columns:repeat(4,minmax(0,1fr))} }
.kv>div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:12px;color:var(--fg-3)}
.kv b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.kv em{font-style:normal;font-size:12.5px;color:var(--fg-2)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:12px;font-weight:600;color:var(--fg-3);background:var(--surface-2)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap.wrap td{white-space:normal;min-width:110px;vertical-align:top}

.split{display:flex;height:12px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface)}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.tile{display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--fg);cursor:pointer;text-align:left;width:100%}
.tile:hover{border-color:var(--brand)}
.tile .ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-strong)}
.tile b{display:block;font-weight:600}
.tile span{font-size:13px;color:var(--fg-2)}

.doc{display:flex;flex-direction:column;gap:12px;max-width:72ch}
.doc ol,.doc ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.doc li{line-height:1.6}
.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* sheet + toast */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:660px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow)}
.sheet>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet>header h2{font-size:17px}
.sheet .body{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet>footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
@media (min-width:700px){ #sheet{align-items:center;padding:24px} .sheet{border-radius:16px;padding-bottom:0} }
.xbtn{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--fg-2)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (min-width:960px){ #toast{bottom:28px} }
.loading{padding:40px 16px;text-align:center;color:var(--fg-3)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
/* v2 additions: store-milk kind, physical label, scan station, line badges */
:root{ --st-ink:#0d6e4f; --st-soft:#dbf1e7; --label-bg:#ffffff; --label-fg:#000000; --label-line:#000000; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --st-ink:#74d3ab; --st-soft:#12302a; } }
:root[data-theme="dark"]{ --st-ink:#74d3ab; --st-soft:#12302a; }
.k-st{background:var(--st-soft);color:var(--st-ink)}
.tabbar{grid-template-columns:repeat(7,minmax(0,1fr))}
.tabbar a{font-size:10.5px}
.ln{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--brand-strong);background:var(--brand-soft);padding:2px 8px;border-radius:999px;white-space:nowrap}
.ln.north{color:var(--fh-ink);background:var(--fh-soft)}
.ln.east{color:var(--ot-ink);background:var(--ot-soft)}
.trk{font:600 15px/1.2 var(--f-mono);letter-spacing:.03em}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.label{aspect-ratio:4/3;max-width:100%;background:var(--label-bg);color:var(--label-fg);border:1.5px solid var(--label-line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.3;overflow:hidden;font-family:var(--f-body)}
.label .lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;font-size:11px;border-bottom:1px solid var(--label-line);padding-bottom:3px}
.label .lh b{font:700 15px/1 var(--f-mono)}
.label .prov{font:700 26px/1.05 var(--f-display)}
.label .row2{display:flex;justify-content:space-between;gap:8px}
.label .cod{align-self:flex-start;border:1.5px solid var(--label-line);font-weight:700;padding:1px 6px;border-radius:4px}
.label svg.bc{width:100%;height:auto;max-height:64px;margin-top:auto;display:block}
.label .code{font:600 12px/1 var(--f-mono);text-align:center;letter-spacing:.06em}
.scanbox{display:flex;flex-direction:column;gap:10px}
.scanbox input.scan{font:600 22px/1.2 var(--f-mono);letter-spacing:.05em;min-height:60px;text-transform:uppercase;border-width:2px;border-color:var(--brand)}
.log{display:flex;flex-direction:column}
.log .row{align-items:center}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand);margin-top:6px}
.timeline li.cur::before{box-shadow:0 0 0 4px var(--brand-soft)}
.prog{font-size:12.5px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.stops{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.stops i{font-style:normal;color:var(--fg-3)}
.stops .done{color:var(--good-ink)}
.stops .late{color:var(--crit-ink);font-weight:600}
</style>

      <div><span>เข้าสาขาช้า</span><b>${sp.stops - sp.onTime} จุด</b><em>${sp.stops - sp.onTime ? `ช้าเฉลี่ย ${durText(sp.lateMin / (sp.stops - sp.onTime))}` : 'ไม่มีจุดที่ช้า'}</em></div>
    </div>
  </section>` : ''}

  <div class="grid2" style="align-items:start">
    <section class="sec">
      <h2>Loaded KM กับ Empty KM</h2>
      <div class="card pad stack">
        ${a.km ? `<div class="split" role="img" aria-label="Loaded ${fmt(loadedPct * 100)}% Empty ${fmt(emptyPct * 100)}%"><i style="width:${loadedPct * 100}%;background:var(--brand)"></i><i style="width:${emptyPct * 100}%;background:var(--serious)"></i></div>
        <div class="legend"><span><i style="background:var(--brand)"></i>มีสินค้า ${fmt(a.loaded)} กม. (${fmt(loadedPct * 100)}%)</span><span><i style="background:var(--serious)"></i>รถเปล่า ${fmt(a.empty)} กม. (${fmt(emptyPct * 100)}%)</span></div>
        <p class="small muted">รถเปล่ายังเป็นต้นทุนของบริษัท ระบบนับทุกช่วงตามเอกสารข้อ 13</p>` : empty('ยังไม่มีทริปที่ปิด', 'ตัวเลขจะขึ้นเมื่อปิดทริปและกรอกเลขไมล์')}
      </div>
      <h2>อัตราสิ้นเปลืองจริง เทียบมาตรฐาน</h2>
      <div class="tbl-wrap"><table><thead><tr><th>ประเภทรถ</th><th class="r">มาตรฐาน</th><th class="r">จริง</th><th class="r">ทริป</th></tr></thead><tbody>
        ${VTYPES.map(t => { const b = a.byType[t]; const real = b && b.liters ? b.km / b.liters : null; const st = real === null ? '' : real >= s.fuelStd[t] ? 'good' : real >= s.fuelStd[t] * 0.9 ? 'warn' : 'crit'; return `<tr><td>${t} ล้อ</td><td class="r">${fmt(s.fuelStd[t], 1)}</td><td class="r">${real === null ? '–' : chip(st, fmt(real, 2))}</td><td class="r">${b ? b.trips : 0}</td></tr>`; }).join('')}
      </tbody></table></div>
    </section>
    <section class="sec">
      <h2>การกระจายงานคนขับ</h2>
      ${drvRows.length ? `<div class="tbl-wrap"><table><thead><tr><th>คนขับ</th><th class="r">เที่ยว</th><th class="r">งาน</th><th class="r">กม.</th><th class="r">เบี้ยเลี้ยง</th></tr></thead><tbody>${drvRows.map(([id, r]) => `<tr><td>${esc(driverName(id))}</td><td class="r">${r.trips}</td><td class="r">${r.jobs}</td><td class="r">${fmt(r.km)}</td><td class="r">${money(r.allowance)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="card">${empty('ยังไม่มีข้อมูลเดือนนี้', '')}</div>`}
      <details class="more card pad"><summary>วิเคราะห์ต้นทุนรายรถ / ราย Route</summary>
        <div class="stack" style="margin-top:10px">
          ${Object.keys(byV).length ? `<div class="tbl-wrap"><table><thead><tr><th>รถ</th><th class="r">เที่ยว</th><th class="r">กม.</th><th class="r">กม./ลิตร</th><th class="r">ต้นทุน/กม.</th><th class="r">รายได้</th></tr></thead><tbody>${Object.entries(byV).sort((x, y) => y[1].trips - x[1].trips).map(([id, r]) => `<tr><td>${esc((vehicleOf(id) || {}).plate || '?')}</td><td class="r">${r.trips}</td><td class="r">${fmt(r.km)}</td><td class="r">${r.liters ? fmt(r.kmFuel / r.liters, 2) : '–'}</td><td class="r">${r.km ? money(r.cost / r.km) : '–'}</td><td class="r">${money(r.rev)}</td></tr>`).join('')}</tbody></table></div>
          <div class="tbl-wrap"><table><thead><tr><th>Route</th><th class="r">เที่ยว</th><th class="r">Standard เฉลี่ย</th><th class="r">Actual เฉลี่ย</th><th class="r">ต้นทุนเฉลี่ย</th></tr></thead><tbody>${Object.entries(byR).sort((x, y) => y[1].trips - x[1].trips).map(([id, r]) => `<tr><td>${esc((routeOf(id) || {}).name || 'ไม่ระบุเส้นทาง')}</td><td class="r">${r.trips}</td><td class="r">${fmt(r.std / r.trips)}</td><td class="r">${fmt(r.km / r.trips)}</td><td class="r">${money(r.cost / r.trips)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="small muted">ยังไม่มีทริปที่ปิดในเดือนนี้</p>'}
        </div>
      </details>
      <h2>สถานะ Maintenance</h2>
      <a class="card pad rowflex" href="#maint" style="text-decoration:none;color:inherit">
        ${chip('crit', `เกินรอบ ${mCounts.crit}`)} ${chip('serious', `ถึงรอบ ${mCounts.serious}`)} ${chip('warn', `ใกล้ถึง ${mCounts.warn}`)} ${chip('good', `ปกติ ${mCounts.good}`)} ${mCounts.unknown ? chip('', `ไม่มีเลขไมล์ ${mCounts.unknown}`) : ''}
      </a>
    </section>
  </div>`;
};

/* ---------- queue ---------- */
PAGES.queue = () => {
  const d = S.d; const s = settings();
  const sites = checkinSites();
  if (ui.queueSite !== 'all' && !d.sites[ui.queueSite]) ui.queueSite = 'all';
  const all = waitingList('all');
  const list = ui.queueSite === 'all' ? all : all.filter(c => c.siteId === ui.queueSite);
  const ready = list.filter(c => c.ready !== false);
  const byType = t => list.filter(c => (vehicleOf(c.vehicleId) || {}).type === t).length;
  const today = dayKey();
  const doneToday = Object.values(d.checkins).filter(c => c.day === today && c.status !== 'waiting' && (ui.queueSite === 'all' || c.siteId === ui.queueSite)).sort(byAt);
  const groups = (ui.queueSite === 'all' ? sites : [d.sites[ui.queueSite]]).map(st => ({ st, items: waitingList(st.id) })).filter(g => g.items.length || ui.queueSite !== 'all');
  const orphan = ui.queueSite === 'all' ? all.filter(c => !d.sites[c.siteId]) : [];
  if (orphan.length) groups.push({ st: { name: 'ไม่ระบุจุด' }, items: orphan });
  return `
  <div class="sec-h">
    ${seg('queueSite', ui.queueSite, [['all', 'ทุกจุด', all.length], ...sites.map(st => [st.id, st.name, all.filter(c => c.siteId === st.id).length])])}
    <a class="btn primary" href="#checkin">${icon('pin')}เช็คอินเข้าคิว</a>
  </div>
  <div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <div class="stat"><span class="lbl">รอคิว</span><span class="val">${list.length}<small>คัน</small></span><span class="sub">พร้อมรับงาน ${ready.length} · ไม่พร้อม ${list.length - ready.length}</span></div>
    <div class="stat"><span class="lbl">ได้งาน/ออกแล้ววันนี้</span><span class="val">${doneToday.filter(c => c.status !== 'cancel').length}<small>คัน</small></span><span class="sub">ยกเลิก ${doneToday.filter(c => c.status === 'cancel').length}</span></div>
  </div>
  <div class="rowflex small meta"><span>รถที่รอคิว แยกประเภท:</span>${VTYPES.map(t => `<span class="vt">${t} ล้อ · ${byType(t)}</span>`).join('')}</div>
  ${groups.length ? groups.map(g => { const cut = cutoffMin(g.st); return `
    <section class="sec">
      <div class="sec-h"><h2>${esc(g.st.name)} ${lineBadge(g.st.line)}</h2><span class="sub">${cut !== null ? `ตัดรอบ Backhaul ${esc(g.st.backhaulCutoff)} · ทันรอบได้งานก่อน → สแตนด์บาย → มาหลังรอบ` : 'เรียงตามเวลาเช็คอิน มาก่อนได้งานก่อน'}</span></div>
      <div class="list">${g.items.length ? g.items.map((c, i) => queueRow(c, i + 1, s)).join('') : empty('ไม่มีรถรอคิวที่จุดนี้', '')}</div>
    </section>`; }).join('') : `<div class="card">${empty('ยังไม่มีรถในคิว', 'ให้คนขับเปิดลิงก์หน้าเช็คอิน (#checkin) แล้วกดเช็คอินเมื่อถึงจุดเช็คอิน', `<a class="btn primary" href="#checkin">${icon('pin')}เปิดหน้าเช็คอิน</a>`)}</div>`}
  ${doneToday.length ? `<details class="more card pad"><summary>ได้งาน / ออกรถ / ยกเลิก วันนี้ (${doneToday.length})</summary><div class="list" style="margin-top:10px">${doneToday.map(c => { const v = vehicleOf(c.vehicleId); const t = c.tripId && d.trips[c.tripId]; return `<div class="row"><div class="main"><div class="l1">${plate(v)} ${vt(v && v.type)} <span class="meta">${esc(driverName(c.driverId, c.driverName))}</span></div><div class="l1 meta">เช็คอิน ${thTime(c.at)} · ${statusChip(CI_STATUS, c.status)} ${t ? `<a href="#trip-${esc(t.id)}">${esc(t.no)}</a>` : ''}</div></div></div>`; }).join('')}</div></details>` : ''}
  <details class="more card pad"><summary>กฎลำดับคิว</summary><div class="doc" style="margin-top:10px">${QUEUE_RULES}</div></details>`;
};
function queueRow(c, pos, s) {
  const v = vehicleOf(c.vehicleId); const m = v ? maint(v) : null;
  const waited = Date.now() - new Date(c.at);
  const stale = waited > s.staleHours * 3600000;
  return `<div class="row">
    <div class="qno ${c.ready === false ? 'off' : ''}"><small>คิว</small><b>${pad(pos)}</b></div>
    <div class="main">
      <div class="l1">${plate(v)} ${vt(v && v.type)} ${own(v)} ${c.trailerPlate ? `<span class="small muted">หาง ${esc(c.trailerPlate)}</span>` : trl(v)}</div>
      <div class="meta">${icon('user')} ${esc(driverName(c.driverId, c.driverName))}</div>
      <div class="meta num">${icon('clock')} เช็คอิน ${thDT(c.at)} · รอ ${dur(waited)}${c.odometer ? ` · ไมล์ ${fmt(num(c.odometer))}` : ''}</div>
      <div class="l1">${queueChip(c)} ${locChip(c)} ${c.ready === false ? chip('serious', 'ไม่พร้อม: ' + (c.issue || '-')) : chip('good', 'พร้อมรับงาน')} ${m && m.state !== 'good' ? chip(m.state === 'unknown' ? '' : m.state, m.label, 'wrench') : ''} ${stale ? chip('warn', 'รอนานผิดปกติ ตรวจสอบ') : ''}${v && num(c.odometer) !== null && num(v.currentKm) !== null && num(c.odometer) < num(v.currentKm) - 50 ? chip('warn', `เลขไมล์ที่แจ้งน้อยกว่าในระบบ (${fmt(num(v.currentKm))})`) : ''}</div>
      ${c.note ? `<div class="small muted">หมายเหตุ: ${esc(c.note)}</div>` : ''}
      <div class="actions">${locLink(c, 'ดูตำแหน่ง')}<span style="flex:1"></span><button class="btn sm" data-act="ciCancel" data-id="${esc(c.id)}" ${dis()}>ยกเลิกคิว</button><button class="btn sm primary" data-act="ciDispatch" data-id="${esc(c.id)}" ${c.ready === false ? 'disabled' : ''}>จัดงานให้คันนี้</button></div>
    </div>
  </div>`;
}
const QUEUE_RULES = `<ol>
  <li><b>สายใต้ (คลังพุทธมณฑลสาย 3) ตัดรอบ 10:00 น.</b> รถที่กลับจากภาคใต้พร้อมงาน Backhaul ต้องถึงบริษัทและเช็คอินภายใน 10:00 น. จึงได้งานต่อก่อน</li>
  <li>ถ้ารถ Backhaul มาไม่ทัน 10:00 น. ฝ่ายจัดรถใช้รถสแตนด์บายที่จอดอยู่สาย 3 แทน ลำดับคิวจึงเป็น: Backhaul ทันรอบ → สแตนด์บาย → Backhaul มาหลังรอบ (ในแต่ละกลุ่มเรียงตามเวลาเช็คอิน)</li>
  <li>รถ Backhaul ที่มาหลังรอบและยังรออยู่ถึงวันถัดไป นับเป็นรถสแตนด์บาย</li>
  <li><b>สายเหนือ</b> เช็คอินที่ปั๊มนครสวรรค์ เรียงตามเวลาเช็คอิน มาก่อนได้งานก่อน</li>
  <li>คนขับ 1 คน และรถ 1 คัน มีคิวที่รออยู่ได้ครั้งละ 1 คิว ถ้ากดซ้ำระบบจะแสดงคิวเดิม</li>
  <li>เช็คอินต้องมีตำแหน่ง (GPS หรือพิกัดจาก Google Maps) ถ้าห่างจุดเช็คอินเกิน 500 ม. เช็คอินได้แต่ติดธง "นอกรัศมี" ให้ฝ่ายจัดรถตรวจ</li>
  <li>รถที่แจ้ง "ไม่พร้อม" ยังอยู่ในคิว แต่ระบบไม่แนะนำให้จัดงานจนกว่าจะแก้ไข</li>
  <li>จัดงานแล้วสถานะเป็น "ได้งานแล้ว" และหลุดจากคิว ถ้ายกเลิกทริป รถกลับเข้าคิวที่ลำดับเดิม</li>
  <li>ระบบติดป้าย "แนะนำ" ให้คันแรกในคิวที่ผ่านทุกเงื่อนไข ฝ่ายจัดรถเลือกคันอื่นได้</li>
</ol>`;

/* ---------- check-in (driver) ---------- */
PAGES.checkin = () => {
  const d = S.d;
  const drivers = Object.values(d.drivers).filter(x => x.active !== false).sort(thSort('name'));
  const vehicles = Object.values(d.vehicles).sort(thSort('plate'));
  const sites = checkinSites();
  if (!sites.some(x => x.id === ui.ci.siteId) && sites.length) ui.ci.siteId = sites[0].id;
  const site = d.sites[ui.ci.siteId]; const cut = cutoffMin(site);
  const mine = Object.values(d.checkins).filter(c => (c.status === 'waiting' || (c.status === 'assigned' && c.day >= addDays(dayKey(), -1))) && ((ui.ci.driverId && c.driverId === ui.ci.driverId) || (ui.ci.vehicleId && c.vehicleId === ui.ci.vehicleId))).sort(byAt).pop();
  const roleBar = role === 'driver'
    ? `<p class="small muted" style="text-align:center">หน้าสำหรับคนขับ · <button class="btn ghost sm" data-act="role" data-v="dispatch">สลับเป็นฝ่ายจัดรถ</button></p>`
    : `<div class="note">หน้านี้คือหน้าที่คนขับเห็นเมื่อเปิดลิงก์ที่ลงท้ายด้วย <b class="mono">#checkin</b> <button class="btn ghost sm" data-act="role" data-v="driver">ดูแบบคนขับ</button> <button class="btn ghost sm" data-act="copyLink" data-v="checkin">${icon('copy')}คัดลอกลิงก์ให้คนขับ</button></div>`;
  if (mine && !ui.ci.showForm) return roleBar + myTripCard() + ticket(mine);
  if (!vehicles.length || !sites.length) return roleBar + `<div class="card">${empty('ยังเช็คอินไม่ได้', !vehicles.length ? 'ยังไม่มีข้อมูลรถในระบบ ฝ่ายจัดรถต้องเพิ่มรถก่อน (เมนู ข้อมูลหลัก)' : 'ยังไม่มีจุดเช็คอิน ฝ่ายจัดรถต้องเพิ่มจุดก่อน (เมนู ข้อมูลหลัก)', role === 'dispatch' ? '<a class="btn primary" href="#master">ไปที่ข้อมูลหลัก</a>' : '')}</div>`;
  const f = ui.ci;
  return `${roleBar}${myTripCard()}
  <form class="card pad stack" data-form="checkin" novalidate>
    <h2>เช็คอินเข้าคิว</h2>
    <p class="meta">กรอกเมื่อถึงจุดเช็คอิน ระบบจะบันทึกเวลาและตำแหน่ง แล้วให้เลขคิว</p>
    <div class="field"><label class="req" for="ci-site">จุดเช็คอิน</label>
      <select id="ci-site" data-bind="ci.siteId" data-rerender="all">${sites.map(st => `<option value="${esc(st.id)}" ${f.siteId === st.id ? 'selected' : ''}>${esc(st.name)}${st.line && LINES[st.line] ? ' · ' + esc(LINES[st.line].name) : ''}</option>`).join('')}</select></div>
    <div class="field"><label class="req" for="ci-driver">ชื่อคนขับ</label>
      <select id="ci-driver" data-bind="ci.driverId"><option value="">— เลือกชื่อ —</option>${drivers.map(x => `<option value="${esc(x.id)}" ${f.driverId === x.id ? 'selected' : ''}>${esc(x.name)}${x.nickname ? ' (' + esc(x.nickname) + ')' : ''}</option>`).join('')}<option value="__other" ${f.driverId === '__other' ? 'selected' : ''}>ไม่มีชื่อในรายการ</option></select>
      ${f.driverId === '__other' ? `<input id="ci-dname" data-bind="ci.driverName" placeholder="พิมพ์ชื่อ-นามสกุล" value="${esc(f.driverName)}">` : ''}
    </div>
    <div class="grid2">
      <div class="field"><label class="req" for="ci-veh">ทะเบียนรถ (หัว / 10 ล้อ)</label>
        <select id="ci-veh" data-bind="ci.vehicleId"><option value="">— เลือกทะเบียน —</option>${vehicles.map(v => `<option value="${esc(v.id)}" ${f.vehicleId === v.id ? 'selected' : ''}>${esc(v.plate)} · ${esc(v.type)} ล้อ</option>`).join('')}</select></div>
      <div class="field"><label for="ci-trailer">ทะเบียนหาง (ถ้าไม่ใช่หางประจำ)</label><input id="ci-trailer" data-bind="ci.trailerPlate" value="${esc(f.trailerPlate)}" placeholder="เว้นว่างถ้าใช้หางประจำ"></div>
    </div>
    ${cut !== null ? `<div class="field"><span class="lbl req">มาพร้อมงาน Backhaul จากภาคใต้ไหม</span>
      <div class="choice"><label><input type="radio" name="ci-bh" value="yes" data-bind="ci.withBackhaul" ${f.withBackhaul === 'yes' ? 'checked' : ''}>มีงาน Backhaul</label><label><input type="radio" name="ci-bh" value="no" data-bind="ci.withBackhaul" ${f.withBackhaul === 'no' ? 'checked' : ''}>ไม่มี (สแตนด์บาย)</label></div>
      <span class="hint">ตัดรอบ ${esc(site.backhaulCutoff)} น. รถมีงาน Backhaul ที่เช็คอินทันได้งานก่อน ถ้ามาหลังรอบจะต่อท้ายรถสแตนด์บาย</span></div>` : ''}
    <div class="field"><span class="lbl req">ตำแหน่งปัจจุบัน</span>
      <button type="button" class="btn block" data-act="gps">${icon('gps')}ใช้ตำแหน่ง GPS ของเครื่อง</button>
      <input id="ci-loctext" data-bind="ci.locText" value="${esc(f.locText)}" placeholder="หรือวางพิกัด / ลิงก์จาก Google Maps เช่น 13.7930, 100.3260" inputmode="url" autocomplete="off">
      <details class="more"><summary class="small">วิธีคัดลอกพิกัดจาก Google Maps</summary><ol class="small meta" style="margin:6px 0 0;padding-left:20px">
        <li>เปิดแอป Google Maps กดจุดสีฟ้า (ตำแหน่งของเรา) ค้างไว้จนมีหมุดสีแดง</li>
        <li>ตัวเลขพิกัดจะขึ้นที่ช่องค้นหาด้านบน เช่น 13.79301, 100.32604</li>
        <li>กดที่ตัวเลขเพื่อคัดลอก แล้วกลับมาวางในช่องด้านบน</li>
        <li>ลิงก์แบบสั้น (maps.app.goo.gl) ไม่มีตัวเลขพิกัด ระบบจะเก็บลิงก์ไว้แต่คำนวณระยะไม่ได้</li></ol></details>
      <div id="ci-loc-out"></div>

function useGPS() {

  const fail = () => { if (done) return; done = true; ui.ci.locMsg = 'gps-fail'; updateLocOut(); };

  } catch { clearTimeout(timer); fail(); }
}
async function submitCheckin() {

  if (dup) errs.push(`${dup.vehicleId === f.vehicleId ? 'รถคันนี้' : 'คนขับคนนี้'}อยู่ในคิวแล้ว (คิวที่ ${queuePos(dup)} ที่ ${siteName(dup.siteId)})`);
  if (errs.length) { f.err = errs.join(' · '); render({ force: true }); return; }
  const L = f.loc;
  let distanceM = null, inRadius = null;
  if (L.lat !== null && site && site.lat !== null && site.lat !== undefined) { distanceM = Math.round(haversine(L, site)); inRadius = distanceM <= (num(site.radiusM) || s.defaultRadiusM); }
  const now = new Date(); const id = uid();

    vehicleId: f.vehicleId, trailerPlate: f.trailerPlate.trim() || null, siteId: f.siteId, withBackhaul: cut !== null ? f.withBackhaul === 'yes' : null,
    lat: L.lat, lng: L.lng, accuracyM: L.acc || null, locSource: L.source || 'link', mapsUrl: L.lat !== null ? mapsUrl(L.lat, L.lng) : L.url,

/* ---------- maintenance ---------- */
PAGES.maint = () => {
  const s = settings(); const f = ui.maint.filter;
  const rows = Object.values(S.d.vehicles).map(v => ({ v, m: maint(v) }));
  const rank = { crit: 0, serious: 1, warn: 2, good: 3, unknown: 4 };
  const counts = {}; rows.forEach(r => (counts[r.m.state] = (counts[r.m.state] || 0) + 1));
  const list = rows.filter(r => f === 'all' || (f === 'due' ? ['crit', 'serious', 'warn'].includes(r.m.state) : r.m.state === f)).sort((a, b) => rank[a.m.state] - rank[b.m.state] || (a.m.remaining ?? 1e9) - (b.m.remaining ?? 1e9));
  return `
  <div class="note small">รอบเข้าศูนย์ทุก <b>${fmt(s.serviceIntervalKm)} กม.</b> · Next Service KM = Last Service KM + ${fmt(s.serviceIntervalKm)} · Remaining KM = Next Service KM − Current KM · เกณฑ์เตือน (ร่าง): ใกล้ถึง ≤ ${fmt(s.warnKm)} กม., ถึงรอบ ≤ ${fmt(s.dueKm)} กม.</div>
  ${seg('maintFilter', f, [['all', 'ทั้งหมด', rows.length], ['due', 'ต้องดูแล', (counts.crit || 0) + (counts.serious || 0) + (counts.warn || 0)], ['crit', 'เกินรอบ', counts.crit || 0], ['unknown', 'ไม่มีเลขไมล์', counts.unknown || 0]])}
  <div class="list">${list.length ? list.map(({ v, m }) => `<div class="row"><div class="main">
    <div class="l1">${plate(v)} ${vt(v.type)} ${own(v)} ${lineBadge(v.line)} ${chip(m.state === 'unknown' ? '' : m.state, m.label, 'wrench')}</div>
    ${m.used !== null ? `<div class="util" style="grid-template-columns:minmax(60px,1fr) auto">${meter(Math.min(1, m.used), m.state === 'good' ? '' : m.state)}<span class="v small">${fmt(Math.max(0, m.used) * 100)}% ของรอบ</span></div>` : ''}
    <div class="small meta num">Current ${fmt(num(v.currentKm))} · Last Service ${fmt(num(v.lastServiceKm))}${v.lastServiceDate ? ` (${thDate(v.lastServiceDate)})` : ''} · Next ${fmt(m.next)} · Remaining ${fmt(m.remaining)}</div>
    <div class="actions"><button class="btn sm" data-act="service" data-id="${esc(v.id)}" ${dis()}>${icon('wrench')}บันทึกเข้าศูนย์</button><button class="btn sm ghost" data-act="edit" data-col="vehicles" data-id="${esc(v.id)}" ${dis()}>แก้ไขเลขไมล์</button></div>
  </div></div>`).join('') : empty('ไม่มีรถในกลุ่มนี้', 'เพิ่มรถพร้อมเลขไมล์ที่ ข้อมูลหลัก')}</div>`;
};

let sheetHandler = null, lastFocus = null;
function openSheet({ title, body, submit = 'บันทึก', onSubmit, danger = false }) {
  lastFocus = document.activeElement;
  const root = $('#sheet');
  root.innerHTML = `<div class="sheet-bg" data-act="closeSheet"></div>
    <form class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t" data-sheet novalidate>
      <header><h2 id="sheet-t">${esc(title)}</h2><button type="button" class="xbtn" data-act="closeSheet" aria-label="ปิด">${icon('x')}</button></header>
      <div class="body">${body}<div id="sheet-err" class="errbox" role="alert" hidden></div></div>
      <footer><button type="button" class="btn" data-act="closeSheet">ยกเลิก</button><button type="submit" class="btn ${danger ? 'danger' : 'primary'}">${esc(submit)}</button></footer>
    </form>`;
  root.hidden = false; sheetHandler = onSubmit;
  document.body.style.overflow = 'hidden';
  const first = root.querySelector('.body input, .body select, .body textarea');
  setTimeout(() => (first || root.querySelector('button[type=submit]')).focus(), 30);
}
function closeSheet() { const root = $('#sheet'); root.hidden = true; root.innerHTML = ''; sheetHandler = null; document.body.style.overflow = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); if (deferred) { deferred = false; render(); } }
function confirmSheet(title, text, label, fn) { openSheet({ title, body: `<p class="meta">${text}</p>`, submit: label, danger: true, onSubmit: async () => { await fn(); } }); }
let toastTimer = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('คัดลอกแล้ว'); }
  catch { openSheet({ title: 'คัดลอกข้อความนี้', body: `<textarea id="copy-box" rows="3" readonly>${esc(text)}</textarea><p class="small muted">กดค้างที่ข้อความเพื่อคัดลอก</p>`, submit: 'ปิด', onSubmit: () => {} }); setTimeout(() => { const b = $('#copy-box'); if (b) b.select(); }, 60); }
}
